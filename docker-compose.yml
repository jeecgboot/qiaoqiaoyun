services:
  qiaoqiaoyun-mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    restart: always
    container_name: qiaoqiaoyun-mysql
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/qiaoqiaoyun-mysql:2.4.0
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 13306:3306
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'select 1 from qiaoqiaoyun.sys_user limit 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - qiaoqiaoyun

  qiaoqiaoyun-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    # ports:
    #   - 16379:6379
    restart: always
    hostname: qiaoqiaoyun-redis
    container_name: qiaoqiaoyun-redis
    networks:
      - qiaoqiaoyun

  qiaoqiaoyun-mongo:
    build:
      context: .
      dockerfile: docker/Dockerfile.mongo
    restart: always
    container_name: qiaoqiaoyun-mongo
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/qiaoqiaoyun-mongo:2.4.0
    ports:
      - 17017:27017
    networks:
      - qiaoqiaoyun

  qiaoqiaoyun-system:
    build:
      context: .
      dockerfile: docker/Dockerfile.javax
    restart: on-failure
    depends_on:
      qiaoqiaoyun-mysql:
        condition: service_healthy
      qiaoqiaoyun-redis:
        condition: service_started
      qiaoqiaoyun-mongo:
        condition: service_started
    container_name: qiaoqiaoyun-system
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/qiaoqiaoyun-system:2.4.0
    hostname: qiaoqiaoyun-system
    ports:
      - 80:80
    networks:
      - qiaoqiaoyun

networks:
  qiaoqiaoyun:
    name: qiaoqiaoyun
