server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口地址配置文件，不缓存，改环境变量重启后立即生效
    location = /_app.config.js {
        add_header Cache-Control "no-cache";
    }
}
